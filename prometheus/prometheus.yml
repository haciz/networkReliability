global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'network-monitor'
    scrape_interval: 10s
    static_configs:
      - targets: ['monitor:2112']
      # Uncomment this line if you're running the app directly without Docker
      # - targets: ['host.docker.internal:2112']

